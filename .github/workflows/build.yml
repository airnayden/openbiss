name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            artifact: openbiss-linux-amd64
            goos: linux
            goarch: amd64
          - os: macos-13
            target: darwin-amd64
            artifact: openbiss-darwin-amd64
            goos: darwin
            goarch: amd64
          - os: macos-latest
            target: darwin-arm64
            artifact: openbiss-darwin-arm64
            goos: darwin
            goarch: arm64
          - os: windows-latest
            target: windows-amd64
            artifact: openbiss-windows-amd64.exe
            goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev \
            xorg-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: go vet
        run: go vet ./...

      - name: Build (Unix)
        if: runner.os != 'Windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          mkdir -p dist
          go build \
            -ldflags "-s -w -X github.com/airnayden/openbiss/internal/config.Version=${{ steps.version.outputs.version }}" \
            -o "dist/${{ matrix.artifact }}" \
            .

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build `
            -ldflags "-s -w -H windowsgui -X github.com/airnayden/openbiss/internal/config.Version=${{ steps.version.outputs.version }}" `
            -o "dist/${{ matrix.artifact }}" `
            .

      - name: Inspect artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x "dist/${{ matrix.artifact }}"
          ls -lh "dist/${{ matrix.artifact }}"
          file "dist/${{ matrix.artifact }}"

      - name: Inspect artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Item "dist/${{ matrix.artifact }}" | Format-List Name,Length,LastWriteTime

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
